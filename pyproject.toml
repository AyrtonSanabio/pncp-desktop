[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pncp-desktop"
version = "0.2.0"
description = "Sincronizador local e retomável de dados públicos do PNCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pypncp>=1.2.1,<2",
    "PySide6>=6.9.2,<6.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pyinstaller>=6.11,<7",
    "ruff>=0.11,<1",
]

[project.scripts]
pncp-desktop = "pncp_desktop.main:main"
pncp-sync = "pncp_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/pncp_desktop/ui.py" = ["E501"]
"src/pncp_desktop/local_database.py" = ["E501"]
"src/pncp_sync/persistence/data_services.py" = ["E501"]
"src/pncp_sync/persistence/repositories.py" = ["E501"]
